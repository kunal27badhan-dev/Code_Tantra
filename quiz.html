<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taking Quiz</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh; 
      padding: 1rem;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #5a67d8, #667eea);
      color: white;
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .progress-bar {
      background: rgba(255,255,255,0.3);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      flex: 1;
      margin: 0 1rem;
    }
    .progress-fill {
      background: white;
      height: 100%;
      transition: width 0.3s ease;
      width: 0%;
    }
    .question-container {
      padding: 2rem;
      min-height: 400px;
    }
    .question {
      margin-bottom: 2rem;
    }
    .question h2 {
      color: #2d3748;
      margin-bottom: 1rem;
      line-height: 1.4;
    }
    .difficulty-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .easy { background: #c6f6d5; color: #38a169; }
    .medium { background: #feebc8; color: #dd6b20; }
    .hard { background: #fed7d7; color: #c53030; }
    .options {
      display: grid;
      gap: 1rem;
    }
    .option {
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }
    .option:hover {
      border-color: #5a67d8;
      background: #edf2f7;
    }
    .option.selected {
      border-color: #5a67d8;
      background: #ebf4ff;
    }
    .option input {
      position: absolute;
      opacity: 0;
    }
    .controls {
      padding: 1.5rem 2rem;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #5a67d8, #667eea);
      color: white;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #4a5568;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    #loading {
      text-align: center;
      padding: 4rem 2rem;
      color: #5a67d8;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>Question <span id="currentQ">1</span> of <span id="totalQ">20</span></div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div><span id="timeLeft">∞</span></div>
    </div>

    <div id="loading">
      <h2>📚 Loading Quiz...</h2>
      <p>Setting up your personalized questions...</p>
    </div>

    <div id="quizContainer" class="hidden">
      <div class="question-container">
        <div class="question">
          <div class="difficulty-badge" id="difficultyBadge">easy</div>
          <h2 id="questionText">Loading question...</h2>
          <div class="options" id="optionsContainer"></div>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-secondary" id="prevBtn" onclick="previousQuestion()">← Previous</button>
        <div id="questionInfo">
          <span id="answered">0</span> answered • <span id="remaining">20</span> remaining
        </div>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Next →</button>
      </div>
    </div>
  </div>

  <script>
    let quiz = null;
    let currentQuestionIndex = 0;
    let answers = [];
    
    async function loadQuiz() {
      try {
        const quizData = localStorage.getItem('currentQuiz');
        if (!quizData) {
          alert('No quiz data found!');
          window.location.href = '/quiz';
          return;
        }
        
        quiz = JSON.parse(quizData);
        answers = new Array(quiz.questions.length).fill(null);
        
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('quizContainer').classList.remove('hidden');
        
        updateQuestionDisplay();
        
      } catch (error) {
        console.error('Failed to load quiz:', error);
        alert('Failed to load quiz. Please try again.');
        window.location.href = '/quiz';
      }
    }
    
    function updateQuestionDisplay() {
      const question = quiz.questions[currentQuestionIndex];
      
      document.getElementById('currentQ').textContent = currentQuestionIndex + 1;
      document.getElementById('totalQ').textContent = quiz.questions.length;
      document.getElementById('questionText').textContent = question.question;
      
      const badge = document.getElementById('difficultyBadge');
      badge.textContent = question.difficulty;
      badge.className = `difficulty-badge ${question.difficulty}`;
      
      // Update progress
      const progress = ((currentQuestionIndex + 1) / quiz.questions.length) * 100;
      document.getElementById('progressFill').style.width = progress + '%';
      
      // Display options
      const container = document.getElementById('optionsContainer');
      container.innerHTML = question.options.map((option, index) => `
        <div class="option ${answers[currentQuestionIndex] === index ? 'selected' : ''}" 
             onclick="selectOption(${index})">
          <input type="radio" name="answer" value="${index}" 
                 ${answers[currentQuestionIndex] === index ? 'checked' : ''}>
          <div>${option}</div>
        </div>
      `).join('');
      
      // Update counters
      const answeredCount = answers.filter(a => a !== null).length;
      document.getElementById('answered').textContent = answeredCount;
      document.getElementById('remaining').textContent = quiz.questions.length - answeredCount;
      
      // Update buttons
      document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
      document.getElementById('nextBtn').textContent = 
        currentQuestionIndex === quiz.questions.length - 1 ? 'Submit Quiz' : 'Next →';
    }
    
    function selectOption(index) {
      answers[currentQuestionIndex] = index;
      updateQuestionDisplay();
    }
    
    function previousQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        updateQuestionDisplay();
      }
    }
    
    async function nextQuestion() {
      if (currentQuestionIndex < quiz.questions.length - 1) {
        currentQuestionIndex++;
        updateQuestionDisplay();
      } else {
        await submitQuiz();
      }
    }
    
    async function submitQuiz() {
      const unanswered = answers.filter(a => a === null).length;
      
      if (unanswered > 0) {
        const confirm = window.confirm(`You have ${unanswered} unanswered questions. Submit anyway?`);
        if (!confirm) return;
      }
      
      try {
        document.getElementById('nextBtn').disabled = true;
        document.getElementById('nextBtn').textContent = 'Submitting...';
        
        const response = await fetch('/api/quiz/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            quizId: quiz.quizId,
            answers: answers
          })
        });
        
        const result = await response.json();
        
        if (response.ok) {
          localStorage.setItem('quizResults', JSON.stringify(result));
          window.location.href = '/result';
        } else {
          alert('Error submitting quiz: ' + result.error);
          document.getElementById('nextBtn').disabled = false;
          document.getElementById('nextBtn').textContent = 'Submit Quiz';
        }
        
      } catch (error) {
        console.error('Submit error:', error);
        alert('Failed to submit quiz. Please try again.');
        document.getElementById('nextBtn').disabled = false;
        document.getElementById('nextBtn').textContent = 'Submit Quiz';
      }
    }
    
    // Load quiz on page load
    loadQuiz();
  </script>
</body>
</html>
